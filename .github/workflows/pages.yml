name: Publish Agent Arcade Cup knockout season
on:
  push:
    branches: [main]
    paths: ['site/season2/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-arcade-cup-pages
  cancel-in-progress: true
jobs:
  stage:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage only the knockout season
        run: |
          python3 site/season2/verify_season.py
          node --check site/season2/cup.js
          mkdir _site
          touch _site/.nojekyll
          for file in index.html cup.css cup.js knockout.json; do
            test -f "site/season2/$file" && test ! -L "site/season2/$file"
            cp "site/season2/$file" _site/
          done
      - name: Test replay and previous season removal in Chromium
        run: |
          npm install --prefix "${RUNNER_TEMP}/cup-qa" playwright@1.62.1 --no-audit --no-fund
          export NODE_PATH="${RUNNER_TEMP}/cup-qa/node_modules"
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "${CHROME_PATH}" ]; then "${RUNNER_TEMP}/cup-qa/node_modules/.bin/playwright" install chromium; fi
          python3 -m http.server 8783 --bind 127.0.0.1 -d _site &
          server=$!
          trap 'kill "${server}"' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8783/ >/dev/null && break; sleep 1; done
          node site/season2/browser.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
