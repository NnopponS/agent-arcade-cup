name: Publish Agent Arcade Cup knockout season
on:
  push:
    branches: [main]
    paths: ['site/season2/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-arcade-cup-pages
  cancel-in-progress: true
jobs:
  stage:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Publish the verified Decision Lab benchmark
        run: |
          mkdir _site
          touch _site/.nojekyll
          cp site/season2/decision-lab.html _site/index.html
          cp site/season2/benchmark.json _site/benchmark.json
          cp kev-bench/scenarios.json _site/scenarios.json
          python3 -c "import json; d=json.load(open('_site/benchmark.json')); assert len(d['models'])==2 and all(len(x['rows'])==56 for x in d['models'].values())"
          grep -F 'New bracket not started' _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
