name: Publish Agent Arcade Cup knockout season
on:
  push:
    branches: [main]
    paths: ['site/season2/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-arcade-cup-pages
  cancel-in-progress: true
jobs:
  stage:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage the Kev testing notice only
        run: |
          mkdir _site
          touch _site/.nojekyll
          cp site/season2/holding.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
